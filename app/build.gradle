plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.skipintrooutro.player'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skipintrooutro.player'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
